# Alembic configuration (feature #2).
#
# The script location and database URL are set programmatically by
# app/core/migrations.py (URL comes from app settings / ALEMBIC_DATABASE_URL),
# so the values here are placeholders used only for bare `alembic` CLI runs.

[alembic]
script_location = alembic
path_separator = os
prepend_sys_path = .
sqlalchemy.url = sqlite:///./watchlist.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S