services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smw
      POSTGRES_PASSWORD: smw
      POSTGRES_DB: smw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smw"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg2://smw:smw@postgres:5432/smw
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-mock}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      API_PROXY_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  # One-shot database backup:  docker compose run --rm db-backup
  # Archives land in ./backups/ (pg_dump custom format, pg_restore-ready).
  db-backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    environment:
      PGPASSWORD: smw
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c 'pg_dump --no-owner --no-privileges --format=custom
      -h postgres -U smw -f /backups/smw-$$(date -u +%Y%m%d-%H%M%S).dump smw
      && ls -lh /backups | tail -n 5'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
